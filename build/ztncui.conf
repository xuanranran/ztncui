# ztncui 运行配置 (由 systemd 通过 EnvironmentFile 读取)
# 修改后执行: systemctl restart ztncui

# HTTP 监听端口 (默认 3000)
#HTTP_PORT=3000

# 在所有网卡上监听 HTTP (留空 = 仅监听 localhost)
#HTTP_ALL_INTERFACES=yes

# HTTPS 端口 (设置后启用 HTTPS, 监听所有网卡; 证书见 etc/tls/)
#HTTPS_PORT=3443

# 仅在指定地址上监听 HTTPS (留空 = 所有网卡)
#HTTPS_HOST=

# ZeroTier 控制器 API 地址
ZT_ADDR=localhost:9993

# 直接指定 ZeroTier 认证 token
# 留空则读取 /var/lib/zerotier-one/authtoken.secret
#ZT_TOKEN=

# 反向代理子路径, 例如 /ztncui (留空 = 根路径)
#BASE_PATH=
