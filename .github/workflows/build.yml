name: Build Install Packages

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build RPM/DEB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Upgrade npm and install node-gyp
        run: |
          npm install -g npm@10
          npm install -g node-gyp
          npm install -g @yao-pkg/pkg

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm build-essential ruby-dev gcc g++ make libgmp-dev
          sudo gem install fpm

      - name: Run Build Script
        working-directory: ./build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Listing Release Directory
        run: ls -R Release/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ztncui-packages
          path: |
            Release/*.rpm
            Release/*.deb
