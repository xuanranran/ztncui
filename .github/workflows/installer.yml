name: Test Installer
on:
  push:
    branches: [master]
    paths: ['scripts/**', '.github/workflows/installer.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/installer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: bash -n scripts/install.sh
      - name: Test fresh setup and configuration preservation
        run: python3 -m unittest discover -s scripts/tests -v
